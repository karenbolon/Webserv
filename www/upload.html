<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Upload Files</title>
	<link rel="stylesheet" href="/style.css">
	<link rel="stylesheet" href="/css/upload.css">
	<script src="/scripts/theme.js"></script>
</head>
<body>
	<div class="upload-container">
		<div class="decoration heart heart-1">💖</div>
		<div class="decoration heart heart-2">💖</div>
		<div class="decoration heart heart-3">💖</div>

		<h1>Upload Files</h1>
		<p class="subtitle">Share your favorite moments! ✨</p>

		<form class="upload-form" action="/upload" method="POST" enctype="multipart/form-data">
			<div class="file-drop-area" id="dropArea">
				<span class="fake-btn">Choose files</span>
				<span class="file-msg">or drag and drop files here</span>
				<input class="file-input" type="file" name="files" multiple onchange="handleFiles(this.files)">
			</div>

			<div class="file-list" id="fileList"></div>

			<button type="submit" class="upload-btn" id="uploadBtn" disabled>Upload Files</button>
			<div class="progress-container" id="progressContainer">
					<div class="progress-bar" id="progressBar"></div>
			</div>
		</form>

		<div class="back-link">
			<a href="/" onclick="goHome(event)">← Back to Gallery</a>
		</div>
	</div>

	<script>
		// Redirection function
		function goHome(event) {
			window.location.href = '/';
		}

		const uploadForm = document.querySelector('.upload-form');
		const fileInput = document.querySelector('.file-input');
		const fileList = document.getElementById('fileList');
		const uploadBtn = document.getElementById('uploadBtn');
		const dropArea = document.querySelector('dropArea');
		const progressContainer = document.getElementById('progressContainer');
		const progressBar = document.getElementById('progressBar');
		let selectedFiles = [];

		// File input change event
		fileInput.addEventListener('change', function(e) {
			handleFiles(e.target.files);
		});

		// Click on drop area to trigger file selection
		dropArea.addEventListener('click', function(e) {
			// Only trigger file input if not clicking on remove buttons
			if (!e.target.closest('.remove-file')) {
				fileInput.click();
			}
		});

		// Drag and drop functionality
		['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
			dropArea.addEventListener(eventName, preventDefaults, false);
			document.body.addEventListener(eventName, preventDefaults, false);
		});

		function preventDefaults(e) {
			e.preventDefault();
			e.stopPropagation();
		}

		['dragenter', 'dragover'].forEach(eventName => {
			dropArea.addEventListener(eventName, highlight, false);
		});

		['dragleave', 'drop'].forEach(eventName => {
			dropArea.addEventListener(eventName, unhighlight, false);
		});

		function highlight(e) {
			dropArea.classList.add('is-active');
		}

		function unhighlight(e) {
			dropArea.classList.remove('is-active');
		}

		dropArea.addEventListener('drop', handleDrop, false);

		function handleDrop(e) {
			const dt = e.dataTransfer;
			const files = dt.files;
			if (files.length > 0) {
				handleFiles(files);
			}
		}

		function handleFiles(files) {
			console.log('Handling files:', files.length); // Debug log

			// Convert FileList to Array and add to existing files
			const newFiles = Array.from(files);

			// Filter out duplicates based on name and size
			newFiles.forEach(newFile => {
				const isDuplicate = selectedFiles.some(existingFile =>
					existingFile.name === newFile.name && existingFile.size === newFile.size
				);
				if (!isDuplicate) {
					selectedFiles.push(newFile);
				}
			});

			displayFiles();
			updateUploadButton();
			updateFileInput();
		}

		function displayFiles() {
			fileList.innerHTML = '';
			selectedFiles.forEach((file, index) => {
				const fileItem = document.createElement('div');
				fileItem.className = 'file-item';

				// Determine file type for better icon
				const fileIcon = getFileIcon(file.type);

				fileItem.innerHTML = `
					<div class="file-item-name">
						<div class="file-icon">${fileIcon}</div>
						<span>${file.name} (${formatFileSize(file.size)})</span>
					</div>
					<button type="button" class="remove-file" onclick="removeFile(${index})">×</button>
				`;
				fileList.appendChild(fileItem);
			});
		}

		function getFileIcon(fileType) {
			if (fileType.startsWith('image/')) return '🖼️';
			if (fileType.startsWith('video/')) return '🎥';
			if (fileType.startsWith('audio/')) return '🎵';
			if (fileType.includes('pdf')) return '📄';
			return '📎';
		}

		function formatFileSize(bytes) {
			if (bytes === 0) return '0 Bytes';
			const k = 1024;
			const sizes = ['Bytes', 'KB', 'MB', 'GB'];
			const i = Math.floor(Math.log(bytes) / Math.log(k));
			return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
		}

		function removeFile(index) {
			selectedFiles.splice(index, 1);
			displayFiles();
			updateUploadButton();
			updateFileInput();
		}

		function updateUploadButton() {
			uploadBtn.disabled = selectedFiles.length === 0;
		}

		function updateFileInput() {
			// Create new DataTransfer object to update file input
			try {
				const dt = new DataTransfer();
				selectedFiles.forEach(file => dt.items.add(file));
				fileInput.files = dt.files;
			} catch (e) {
				console.log('DataTransfer not supported, file input won\'t be synced');
			}
		}

		// function removeFile(index) {
		// 	selectedFiles.splice(index, 1);
		// 	displayFiles();
		// 	uploadBtn.disabled = selectedFiles.length === 0;

		// 	// Update file input
		// 	const dt = new DataTransfer();
		// 	selectedFiles.forEach(file => dt.items.add(file));
		// 	fileInput.files = dt.files;
		// }

		// Add some magical sparkles
		function createSparkle() {
			const sparkle = document.createElement('div');
			sparkle.className = 'magic-sparkle';
			sparkle.textContent = '✨';
			parkle.style.position = 'fixed';
			sparkle.style.left = Math.random() * 100 + '%';
			sparkle.style.top = Math.random() * 100 + '%';
			sparkle.style.pointerEvents = 'none';
			sparkle.style.zIndex = '1000';
			sparkle.style.animation = 'fadeOut 3s forwards';
			document.body.appendChild(sparkle);

			setTimeout(() => sparkle.remove(), 3000);
		}

		// Add CSS for sparkle animation
		const style = document.createElement('style');
		style.textContent = `
			@keyframes fadeOut {
				0% { opacity: 1; transform: translateY(0); }
				100% { opacity: 0; transform: translateY(-50px); }
			}
		`;
		document.head.appendChild(style);

		setInterval(createSparkle, 2000);

		// Debug: Log when page loads
		console.log('Upload page loaded, drag and drop should work');

		//setInterval(createSparkle, 2000);

	</script>
</body>
</html>
